<svg width="100%" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#0d3b66" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)" />
  <rect width="900" height="220" rx="14" fill="url(#grid)" />

  
  <circle cx="140" cy="40" r="110" fill="#38bdf8" fill-opacity="0.08" />
  <circle cx="770" cy="180" r="130" fill="#6366f1" fill-opacity="0.10" />

  
  <text x="36" y="42" fill="#38bdf8" fill-opacity="0.22" font-family="Consolas, monospace" font-size="13">
    (¬x₁ ∨ x₂ ∨ x₃) ∧ (¬sⱼ≤t ∨ sⱼ≤t+1) ∧ (∀C ∈ 𝒞 : ⋁ ¬xⱼₜ)
  </text>
  <text x="720" y="42" fill="#94a3b8" fill-opacity="0.35" font-family="Consolas, monospace" font-size="12">
