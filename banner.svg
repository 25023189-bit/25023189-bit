  </text>

  
  <path fill="#38bdf8" fill-opacity="0.14" d="M0,185 Q150,165 300,185 T600,185 T900,185 L900,220 L0,220 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0,185 Q150,165 300,185 T600,185 T900,185 L900,220 L0,220 Z;
              M0,185 Q150,205 300,185 T600,185 T900,185 L900,220 L0,220 Z;
              M0,185 Q150,165 300,185 T600,185 T900,185 L900,220 L0,220 Z" />
