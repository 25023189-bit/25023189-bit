  <text x="450" y="108" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Ubuntu, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="1.5">
    THE DUNG BUI
  </text>

  
  <rect x="310" y="122" width="280" height="3" rx="1.5" fill="url(#accent)" />

  
  <text x="450" y="152" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Ubuntu, -apple-system, sans-serif" font-size="17" font-weight="500" letter-spacing="0.8">
