<svg width="900" height="28" viewBox="0 0 900 28" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="35%" stop-color="#64748b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="rightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#64748b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
