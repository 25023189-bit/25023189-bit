  <rect x="30" y="7" width="382" height="14" fill="url(#miniChainL)" />
  <rect x="488" y="7" width="382" height="14" fill="url(#miniChainR)" />

  
  <g transform="translate(450, 14)">
    
    <path d="M -26,-6 L -19,0 L -26,6" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round" />
